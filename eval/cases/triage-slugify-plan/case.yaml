  note: >-
    The plan is Didi's text as submitted. The idea's title is written for this case. The tree is
    the repository's code files at 1fd6c49 (blobs below), with package.json cut to its scripts and
    the two packages the code needs; the gallery and tooling folders are left out.
  blobs:

input:
  idea:
    id: e1ba57aa-5674-4170-bfb2-0f457a1a91f5
    title: Slugify helper
  plan: >-
    Add a small helper in src/slugify.ts that turns a title into a URL slug: lowercase, letters
    and digits kept, every run of other characters becomes one hyphen, and no hyphen at either
    end. For example "Hello, World!" gives "hello-world" and "  Foreman 2.0  " gives
    "foreman-2-0". An empty result returns an empty string. Add unit tests in
    test/slugify.test.ts covering those cases. No user-facing change, and nothing else in the
    repository changes.
  commitSha: 1fd6c49dc6790389615891c43c6938048c2846d8
expected:
  items:
    - name: helper
      covers:
        - src/slugify.ts
        - test/slugify.test.ts
      after: []
  why: One small helper and its tests are one pull request a reviewer reads in one sitting.
example:
  items:
    - key: slugify-helper
      title: Add the slugify helper with unit tests
      track: code
      description: >-
        Add slugify(title) in src/slugify.ts as the plan describes, with unit tests in
        test/slugify.test.ts.
      acceptanceCriteria:
        - slugify("Hello, World!") returns "hello-world" and slugify("  Foreman 2.0  ") returns
          "foreman-2-0".
        - The slug is lowercase, keeps letters and digits, turns every run of other characters
          into one hyphen, and has no hyphen at either end.
        - An input whose slug would be empty returns an empty string.
        - Unit tests in test/slugify.test.ts cover each case above.
      pathsInScope:
        - src/slugify.ts
        - test/slugify.test.ts
      checks:
        - npm run test
        - npm run lint
      blockedBy: []
      needsDidi: false

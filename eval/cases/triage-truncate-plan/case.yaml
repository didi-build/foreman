    title: Truncate helper
  plan: >-
    Add a small helper in src/truncate.ts: truncate(text, max) returns text unchanged when it has
    at most max characters; otherwise it returns the first max - 1 characters followed by one
    ellipsis character, so the result has exactly max characters. A max below 1 throws a
    RangeError. Add unit tests in test/truncate.test.ts covering those cases. No user-facing
    change, and nothing else in the repository changes.

input:
  idea:
    id: 2a4d0c61-b9a3-4ddd-84c3-8c607cbe8101
    title: One way to show prop values in the gallery
  plan: |-
    Two parts, in this order.

    First, add a small helper in src/format-prop-value.ts: formatPropValue(value) returns the text the component gallery shows for one prop value. It returns JSON.stringify(value), or the text undefined when JSON.stringify gives nothing, as it does for undefined. Add unit tests in test/format-prop-value.test.ts for a string, a number, a boolean, an object and undefined.

    Second, once the helper is merged, use it in the gallery page, gallery/App.tsx, in place of the inline JSON.stringify call in its props table. No variant in the gallery has an undefined prop today, so the page looks exactly as it does now.

    No user-facing change, and nothing else in the repository changes.
  commitSha: 95185416c01c8b7c6d64b6d22f381f76486e1504

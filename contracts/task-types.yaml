# Task types (ADR 0114 section 1): the unit that model routing and the model scorecard use. A task
# type is the role plus a small task class. The core reads this file at the spec version (ADR 0105);
# no flow carries its own list.
#
# Each role's allowed task types and its default are in its bot file (contracts/bots/<role>.yaml,
# `task_types`), as ADR 0114 says. At dispatch the core takes the role's default. Who sets another
# allowed class on an item is settled with M3.6, so until then every Developer run is
# `developer:code`.
#
# Add a task type only when the scorecard shows that one type hides two different results.

task_types:
  "developer:code": Developer work on application code. The Developer's default.
  "developer:infra": Developer work on infrastructure code, workflows or migrations.
  designer: Designer work.
  "qa:review": QA review of a pull request.
  "qa:visual": QA's visual comparison of a design item's components with the approved option (D-242).
  council: A Council question.
  triage: Triage, and similar short classification or breakdown work.

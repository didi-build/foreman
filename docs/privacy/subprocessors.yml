schema_version: 1
subprocessors:
  - name: Supabase
    purpose: Hosts the state store (managed Postgres, ADR 0103)
    data: Project Factory state, including the operator's decisions word for word (docs/privacy/data-map.yml)
    location: Canada (ca-central-1)
    verified: false
  - name: Windmill
    purpose: Runs the factory's flows (Windmill Cloud)
    data: Flow inputs and results, including the operator's own words where a result quotes them (docs/privacy/data-map.yml)
    location: To confirm at first hosting
    verified: false
  - name: Anthropic
    purpose: Model provider for agent runs whose route names it (ADR 0114)
    data: Each such run's instructions, input and tool results, which can quote the operator's decisions and a project's repository (docs/privacy/data-map.yml)
    location: United States, to confirm
    verified: false
  - name: DeepInfra
    purpose: Model provider for agent runs whose route names it (D-421, D-425)
    data: Each such run's instructions, input and tool results, which can quote the operator's decisions and a project's repository (docs/privacy/data-map.yml)
    location: United States, to confirm
    verified: false

schema_version: 1
d1_tables: {}
other_items:
  # The state store (ADR 0104). Not a D1 database, so nodrift's migration check does not read it.
  - id: postgres.factory_state_store
    whose: operator
    data: >-
      Ideas, work items, transitions, evidence, runs and settings for Project Factory projects, and
      decisions that copy the operator's own answers word for word. No end-user personal data:
      agents work from synthetic data (D-154).
    purpose: The source of truth for every item's state, and the audit record of who decided what.
    storage: Supabase Postgres, ca-central-1, schema factory (ADR 0103)
    processors: [Supabase]
    retention: >-
      For the life of the system; transitions, evidence and decisions are append-only audit records
      (confirmed by Didi, D-169).
    who_can_see: >-
      operator, the runner, the state API, and agent runs of the same project (D-468): each run's
      input ends with a short summary of its own project's records, the decisions word for word but
      cut, and never a decision's scope, such as an approval's page link and approvers (ADR 0119
      slice 3a), and the read-only context tools' results, cut and framed as data (ADR 0119 slices
      3b to 3d). A run's input and its tool results go to the model provider its route names
      (Anthropic or DeepInfra), as runs' inputs already do.
    source: db/migrations/0001_factory_schema.sql
    verified: false
  # The documentation lookup (ADR 0119 slice 4, D-460, D-472). A run reads a page from a site on
  # the trusted list through its egress proxy; Foreman stores neither the address nor the page.
  - id: agent_runs.docs_lookup
    whose: operator
    data: >-
      The address of a documentation page a Developer run reads, which can carry text from the
      project's repository (D-472), and the page's text. No secret: an address that holds a known
      secret value is refused. No end-user personal data: agents work from synthetic data (D-154).
    purpose: Reading the docs of the language, frameworks and tools a project uses (ADR 0119).
    storage: >-
      Not stored by Foreman. The run's egress proxy logs the site's host only, never the address.
      The page's text goes into the run, and so to the model provider its route names.
    processors: [Anthropic, DeepInfra]
    retention: >-
      Foreman keeps nothing. A documentation site keeps its own request logs under its own policy.
    who_can_see: >-
      the documentation site on the trusted list (setting trusted_docs_hosts) that the run asks,
      the run, and the model provider its route names
    source: src/egress-proxy/lookup.ts
    verified: false
  # Windmill's job history (D-294). Flow inputs and results stay in Windmill after each run.
  - id: windmill.job_history
    whose: operator
    data: >-
      The inputs and results of the runner's Windmill flows: item ids, states and step outcomes, and
      the operator's own words where a result quotes them (approval answers, Didi's notes in the
      held-items list). No end-user personal data: agents work from synthetic data (D-154).
    purpose: Running the factory's flows, and the operator reading what each run did.
    storage: Windmill Cloud (region to confirm at first hosting)
    processors: [Windmill]
    retention: >-
      Windmill's job retention for the workspace's plan; to confirm at first hosting.
    who_can_see: operator, members of the Windmill workspace
    source: flows/windmill.yaml
    verified: false

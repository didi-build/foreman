# The runner's Windmill flows, schedules and resources, as data (build plan M3.1). Nothing here is
# deployed. Deploying is mechanical once the Windmill workspace and token exist (first-hosting
# runbook, step 15): bundle each entry with its imports and contracts/, push it as a
# script at its path, create the schedule and the approval flow, and store each resource and
# variable at the path below. test/flows/windmill-description.test.ts keeps this file in step
# with the code.
#
# Why these flows, and not one per contract move: the architecture's reason for "one flow per
# transition" is that Windmill flows are acyclic while the machine has cycles, so each flow run
# handles exactly one transition and durable state lives in the store (section 2.4). The
# transition flow keeps that: one run, one move. Copying each contract move into a flow of its own
# would give every flow its own copy of a rule, which essential 7 forbids; the contracts and
# guards already say which moves exist and what each needs.

workspace_folder: f/foreman

flows:
  - name: reconcile
    path: f/foreman/reconcile
    entry: flows/reconcile.ts
    trigger: schedule
    # Every `reconcile_interval_minutes` (setting, 120 until Kubernetes, D-164). Windmill reads
    # the schedule from here, not from the setting; changing one means changing both. With
    # `dry_run` off it runs the merge pass (M3.3, O-31), which merges through the runner App's
    # GitHub credential (D-127) once that App exists (D-178), then the staging pass (M3.4, O-37),
    # whose check needs the deploy adapter's staging target (M3.7), then the builder runs pass,
    # which starts the fix round of an item a failed QA round or staging check sent back (O-41).
    # Its plan approval pass opens Didi's request for each plan the planning chat submitted and
    # takes the idea's move on Didi's answer (D-266); its hold release pass releases a held item
    # Didi approved (D-269); its option capture pass captures each design item's exploration
    # options once CI has rendered them and opens Didi's visual-approval request (O-88). Every
    # pass, whatever the switches, its result lists the held items with no open release request
    # for Didi's daily check (`heldItems`, D-272, O-90); listing writes nothing and asks nothing.
    schedule:
      every_minutes: 120
      cron: "0 0 */2 * * *"
      timezone: UTC

  - name: daily_check
    path: f/foreman/daily_check
    entry: flows/daily-check.ts
    trigger: schedule
    # Didi's daily check (spec section 6, M4.4, O-91): once a day, about 30 runs a month next to
    # the reconcile flow's 360 (D-164). Its result is the check as JSON plus short plain text,
    # read in the job's result in Windmill; it can also be started by hand from its page. It
    # reads only: it writes nothing, opens or answers no request (D-272), and runs whatever the
    # switches say, noting them. At 06:00 Toronto time, daylight saving included (D-297). Delivery (push, email,
    # a page) waits for M4.3; nothing here sends anything.
    schedule:
      every_minutes: 1440
      cron: "0 0 6 * * *"
      timezone: America/Toronto

  - name: dispatch
    path: f/foreman/dispatch
    entry: flows/dispatch.ts
    # Who calls it in live mode is open: the live reconcile pass is not built (M2.4 stops on
    # `dry_run` false). Until then, by hand from the Windmill page.
    trigger: called

  - name: record_run_end
    path: f/foreman/record_run_end
    entry: flows/record-run-end.ts
    # Called with a run id. The handle the dispatch kept on the run (runs.handle, migration 0006)
    # is read from the store. Once the end is recorded it asks for the move the run's report
    # triggers, and the guards decide (O-23); a QA pass goes through the merge (O-31), and QA's
    # fail starts the builder's fix round (O-41). Who calls it in live mode is open, as for
    # dispatch.
    trigger: called

  - name: verify_staging
    path: f/foreman/verify_staging
    entry: flows/verify-staging.ts
    # Called with a repository and a commit when GitHub reports a staging deploy (a
    # `deployment_status` event, O-34). It verifies each item of the repository in Verifying on
    # staging, since a later commit's deploy may cover its merge commit (D-225), reading the deploy
    # from GitHub itself. A fail move starts the builder's fix round (O-41). Who calls it on the
    # event is open, as for dispatch: the receiver records the delivery and holds no Windmill
    # credential. The reconcile flow's staging pass is the backstop.
    trigger: called

  - name: cancel_runs
    path: f/foreman/cancel_runs
    entry: flows/cancel-runs.ts
    # D-202: called right after the kill switch is turned on, and run by the reconcile flow on
    # every pass the kill switch stops. It stops every active agent run and ends it cancelled.
    trigger: called

  - name: plan_approval
    path: f/foreman/plan_approval
    entry: flows/plan-approval.ts
    # Called with an idea id by the state API, right after it records the planning chat's
    # submission (D-273 (2), D-274), with its own Windmill credential that can start only this
    # flow (platform/state-api/windmill-plan-approval-token, below). One run per submission. It
    # opens Didi's plan-approval request at once; the reconcile flow's plan approval pass stays
    # as the safety net for a start that failed.
    trigger: called

  - name: option_capture
    path: f/foreman/option_capture
    entry: flows/option-capture.ts
    # Called with a design item's id once CI has finished on its PR head (O-88, D-274). It
    # captures the Designer's exploration options from CI's `options` bundle, opens Didi's
    # visual-approval request and asks again for the Designer report's move into Waiting for
    # Didi. A refusal the Designer caused counts once per head and starts the fix round; the
    # request links CI's run only on a private repository (O-89). Who calls it on CI's end is open, as for verify_staging: the receiver records the
    # delivery and holds no Windmill credential. The run-end flow tries the same capture at a
    # Designer run's end, and the reconcile flow's capture pass is the backstop.
    trigger: called

  - name: hold_release_request
    path: f/foreman/hold_release_request
    entry: flows/hold-release-request.ts
    # Called with a held item's id only when Didi asks for a fresh release request for it from
    # the held-items list in the daily check (D-272, O-90): each entry names this path and the
    # input. No schedule, pass or other flow starts it, so nothing re-asks Didi on a timer. It
    # opens the same request the Triage handoff opens, and refuses an item that is not held, one
    # with an open request and one whose release is due; the kill switch and dry run write
    # nothing. How Didi reaches it from the daily check is open (O-90): until that is settled,
    # Didi starts it from its page in the Windmill workspace, signed in. No new credential.
    trigger: called

  - name: request_transition
    path: f/foreman/request_transition
    entry: flows/request-transition.ts
    # For an event, a bot report, a human or a timeout, with the trigger's own id. Which caller
    # turns a bot report or a GitHub event into this call is open (M3.1 report).
    trigger: called

  - name: approval
    path: f/foreman/approval
    # A Windmill flow of two steps, like the M0.4 spike: `ask` suspends with the form below and
    # sends the approval page to Didi only (D-170), `record` is this entry. `ask` needs the
    # notification adapter and the gate lifecycle (M4.1), so only `record` is built. The same form
    # answers the planning chat's plan-approval request (D-266) and a held item's release request
    # (D-269): neither lists options, so the Options field shows none. A visual approval's
    # question ends with the link to the CI run holding the screenshots (O-89), which `ask`
    # shows as the request's question text.
    entry: flows/approval-resume.ts
    trigger: approval_resume
    suspend:
      required_events: 1
      # D-170: every approval expires after a short time. One day, as in M0.4, until M4.1 sets it.
      timeout_seconds: 86400
      continue_on_disapprove_timeout: true
      # D-200, D-254: the three answers are the form's `decision` field, so the page's own cancel
      # button is hidden and a resume can only be an answer or a timeout. Checked against
      # Windmill's OpenFlow spec at deploy (first-hosting runbook, step 15).
      hide_cancel: true
      # D-254: one form with three fields. The rules (Approve names exactly one option on a
      # request that lists options; Request changes and Reject need feedback) are checked by the
      # runner after the form is sent (src/core/approvals.ts); an answer that breaks one records
      # nothing and a fresh request opens with a one-line note saying why.
      resume_form:
        decision:
          type: string
          required: true
          enum: [Approve, Request changes, Reject]
        # A multi-select of the request's own options. The list is empty here and filled per
        # request: `ask` returns Windmill's dynamic enums for the form, `{enums: {options:
        # [...]}}`, from `approvalFormEnums(gate)` (the request's `payload.options`). Checked at
        # deploy (first-hosting runbook, step 15): that Windmill fills the choices from `enums`,
        # that an array of strings with enum items renders as a multi-select, and how it looks
        # on Didi's phone. A request that lists no options shows an empty field.
        options:
          type: array
          required: false
          items: { type: string, enum: [] }
        feedback: { type: string, required: false }
        # D-278: on a visual approval, Didi's own judgement of the change's size, optional. Left
        # blank, the Council's call on that request counts as unmeasured. A choice, not a
        # checkbox, so that skipping it is not read as "No".
        small_tweak:
          type: string
          required: false
          enum: ["Yes, a small tweak", "No, not a small tweak"]

# GitHub webhooks go to the receiver service (ADR 0113), not to Windmill, so no flow ingests
# them and none is listed here.

resources:
  # A run's model key is read at the path its bot file's provider names for the run's project,
  # projects/<slug>/models/<provider> (D-143, contracts/bots/). Each is stored at first hosting.
  secrets:
    - path: platform/state-store/runner-database-url
      holds: A login user in the factory_runner role (ADR 0104). New credential at first hosting
    - path: platform/agent-cluster/runner-token
      holds: The runner's cluster token (ADR 0106 section 1, first-hosting runbook step 8)
    # Read by the state API, not by a flow (D-266): kept here so the vault holds it like every
    # other secret, and copied into the state API's Secret `state-api-planning-token` (key
    # `sha256`) at first hosting. The token itself is kept only in the planning chat's settings.
    - path: platform/state-api/planning-token-sha256
      holds: The SHA-256 of the planning chat's state API token (D-266). New credential at first hosting
      read_by: state API
    # Read by the state API, not by a flow (D-273 (2)): a Windmill token that can start only the
    # plan_approval flow above, copied into the state API's Secret
    # `state-api-windmill-plan-approval-token` (key `token`) at first hosting.
    - path: platform/state-api/windmill-plan-approval-token
      holds: A Windmill token that can start only f/foreman/plan_approval (D-273). New credential at first hosting
      read_by: state API
  values:
    - name: spec_version
      holds: The git commit of docs/spec.md and contracts/ the bundle was built from
    - name: github_developer_app_login
      holds: The Developer App's login (D-156)
    - name: github_designer_app_login
      holds: The Designer App's login (D-156)
    - name: github_runner_app_slug
      holds: The runner App's slug (D-156)
    - name: agent_cluster_endpoint
      holds: The cluster's API address (first-hosting runbook step 8)
    - name: agent_cluster_ca_certificate
      holds: The cluster's CA certificate (first-hosting runbook step 8)
    - name: agent_run_settings
      holds: The Kubernetes run settings as JSON, with no secret in them (ADR 0106), the repo map Job's image, resources and deadline included (D-275 (2))
    - name: agent_images
      holds: The agent image references by image kind as JSON, each pinned by digest. Each bot file (contracts/bots/) names its kind
  # Reading the execution count needs a Windmill token that can list the workspace's jobs. It is
  # a new credential at first hosting; until then the count is not read and the pass says so.
  windmill_token: needed for the execution count (D-167)

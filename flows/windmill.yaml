# The runner's Windmill flows, schedules, secrets and values, as data (build plan M3.1). Nothing
# here is deployed yet. The Windmill deploy workflow (D-371, first-hosting runbook step 15)
# bundles each entry with its imports and the files in `bundle_files` embedded, pushes it as a
# script at its path with its `job_token_scopes`, and creates the schedules and the approval flow;
# each secret and value is a Windmill variable at the path below (D-370).
# test/flows/windmill-description.test.ts keeps this file in step with the code.
#
# Why these flows, and not one per contract move: the architecture's reason for "one flow per
# transition" is that Windmill flows are acyclic while the machine has cycles, so each flow run
# handles exactly one transition and durable state lives in the store (section 2.4). The
# transition flow keeps that: one run, one move. Copying each contract move into a flow of its own
# would give every flow its own copy of a rule, which essential 7 forbids; the contracts and
# guards already say which moves exist and what each needs.

workspace_folder: f/foreman

# The repository files every bundle carries besides its imports, because the code reads them when
# it runs: the contracts, task types and bot files, and Supabase's CA certificate, which the
# runner's database connection verifies the server against (D-364, O-117). Without the
# certificate the runner refuses to connect. A folder ends in `/` and stands for every file under
# it. The deploy embeds them in each bundle by their paths from the repository root
# (`bundleFilesDefine` in src/adapters/bundle-files/embed.ts), and the code reads them only
# through src/adapters/bundle-files/files.ts, from the bundle in Windmill and from disk elsewhere
# (O-121).
bundle_files:
  - contracts/
  - src/adapters/store-postgres/supabase-ca.crt

# Each entry's `job_token_scopes` cap the token of every job of its script (D-371, O-121): without
# them a job runs with all the rights of whoever started it. Every flow reads only its secrets and
# values, the variables under the folder (flows/lib/windmill.ts), and calls no other Windmill API;
# the reconcile flow also reads the month's execution count, which needs `workspaces:read`
# (Windmill cannot limit that scope to paths). The routes about a job's own run (its progress and
# its flow's step results) stay open to it whatever the scopes (Windmill's source, version
# 1.865.0, `is_own_job_runtime_route` in windmill-api-auth `scopes.rs`).
flows:
  - name: reconcile
    path: f/foreman/reconcile
    entry: flows/reconcile.ts
    trigger: schedule
    job_token_scopes: ["variables:read:f/foreman/*", "workspaces:read"]
    # Every `reconcile_interval_minutes` (setting, 120 until Kubernetes, D-164). Windmill reads
    # the schedule from here, not from the setting; changing one means changing both. It is the
    # safety net for missed events (D-274): its pass plans release, dispatch and advance from
    # evidence the same way in dry run and live mode. With `dry_run` off it acts on that plan
    # first (D-329 slice 3, O-103): each release, the first run of each ready item, QA's run on
    # each item in review that has none on its head (the review, then on a design item the visual
    # comparison; N-80, O-104), and each move into QA review with QA's run on the head, all started
    # inside this one run, so a pass adds no Windmill run per item. Each of these is the safety
    # net for an event start (D-329 slice 4, O-104). Then it runs the merge pass (M3.3, O-31),
    # which merges through the runner App's GitHub credential (D-127) once that App exists
    # (D-178), and the merged-change pass after it (D-308 (3)), then the staging deploy backstop,
    # which deploys CI's newest build on main for a project whose item in Verifying on staging has
    # no deploy recorded (D-353, O-116; in dry run it reports what it would deploy), then the
    # staging pass (M3.4, O-37), whose check reads the commit marker staging serves, and last the
    # builder runs pass, which starts the fix round of an item a failed QA round or staging check
    # sent back (O-41). The full order is in flows/lib/live-passes.ts.
    # Its plan approval pass opens Didi's request for each plan the planning chat submitted and
    # takes the idea's move on Didi's answer (D-266); its hold release pass releases a held item
    # Didi approved (D-269); its option capture pass captures each design item's exploration
    # options once CI has rendered them and opens Didi's visual-approval request (O-88). Every
    # pass, whatever the switches, its result lists the held items with no open release request
    # for Didi's daily check (`heldItems`, D-272, O-90), and the stalled runs and items from the
    # one stall check the daily check also reads (`stalledRuns`, `stalledItems`, D-302, O-94);
    # listing writes nothing and asks nothing.
    schedule:
      every_minutes: 120
      cron: "0 0 */2 * * *"
      timezone: UTC

  - name: scan
    path: f/foreman/scan
    entry: flows/scan.ts
    trigger: schedule
    job_token_scopes: ["variables:read:f/foreman/*"]
    # The Scanner's stage 1 (D-299, D-300, O-92): once a day at 05:00 Toronto time, an hour
    # before the daily check, which shows what it found (D-297). About 30 runs a month (D-164).
    # It scans every project's repository at its default branch's head with fixed checks and no
    # model, in the repo map Job's scan mode (same isolation, the same one contents read token),
    # and files each new finding as an idea in that project, at most 5 per scan, duplicates of an
    # open idea or item merged. It never changes code, opens a PR or opens a gate request. Under
    # the kill switch or in dry run, and until the runner App exists (D-178), it scans nothing,
    # records nothing and says so in its result. It can also be started by hand from its page.
    schedule:
      every_minutes: 1440
      cron: "0 0 5 * * *"
      timezone: America/Toronto

  - name: daily_check
    path: f/foreman/daily_check
    entry: flows/daily-check.ts
    trigger: schedule
    job_token_scopes: ["variables:read:f/foreman/*"]
    # Didi's daily check (spec section 6, M4.4, O-91): once a day, about 30 runs a month next to
    # the reconcile flow's 360 (D-164). Its run's result is the page Didi reads (D-319, D-320,
    # O-100): Windmill's `render_all` with the check as a page for a phone first, then the check
    # as JSON plus short plain text. Didi bookmarks this flow's run list, signed in, and opens the
    # latest run; it can also be started by hand from its page. It reads only: it writes nothing,
    # opens or answers no request (D-272), and runs whatever the switches say, noting them. At
    # 06:00 Toronto time, daylight saving included (D-297). Nothing here sends anything: no push
    # alert and no email (D-319).
    schedule:
      every_minutes: 1440
      cron: "0 0 6 * * *"
      timezone: America/Toronto

  - name: dispatch
    path: f/foreman/dispatch
    entry: flows/dispatch.ts
    # No flow or service calls it (D-329 slice 3, O-103): the reconcile flow's live pass and
    # every flow whose move makes an item ready start the run in their own run, through the same
    # start path (flows/lib/start-run.ts, flows/lib/ready-runs.ts), so a start adds no Windmill
    # run (D-164). It stays for a start by hand from its Windmill page, for example at rehearsal.
    trigger: called
    job_token_scopes: ["variables:read:f/foreman/*"]

  - name: record_run_end
    path: f/foreman/record_run_end
    entry: flows/record-run-end.ts
    # Called with a run id. The handle the dispatch kept on the run (runs.handle, migration 0006)
    # is read from the store. Once the end is recorded it asks for the move the run's report
    # triggers, and the guards decide (O-23); a QA pass goes through the merge (O-31), and QA's
    # fail starts the builder's fix round (O-41). The run watcher calls it (D-330, O-102): a small
    # service in the platform namespace that watches the run Jobs of the agent namespaces and,
    # when a run's agent Job, or QA's fetch Job, stops for any reason (finished, crashed, out of
    # memory, killed or past its deadline), starts this flow once for that run, with
    # `{"input": {"runId": ...}}`, using its own Windmill token (the `platform` environment
    # secret `RUN_WATCHER_WINDMILL_TOKEN`, in the cluster Secret `run-watcher-windmill-token`,
    # first-hosting runbook step 15) through the shared Windmill egress proxy (D-328). On a restart it sends each stopped Job still present, since the end's cleanup
    # deletes the Job. A QA fetch Job's success moves the run to its review here. The cancel-runs
    # flow records the ends it causes itself, and the live reconcile pass (D-329 slice 3) is the
    # backstop. Inside the same run (D-329 slice 4, O-104), with no Windmill run added: once a
    # builder's report moves the item into In QA review, QA's review starts on the head the
    # runner's `ci_run` names (N-80), and once QA's review passed on a design item, its visual
    # comparison; QA's merge is followed by the merged-change check (D-308 (3)); and last, the
    # run's freed slot starts the first runs of the project's ready items, in the pass's order,
    # as many as admission lets (N-81).
    trigger: called
    job_token_scopes: ["variables:read:f/foreman/*"]

  - name: deploy_staging
    path: f/foreman/deploy_staging
    entry: flows/deploy-staging.ts
    # Called with a repository and a CI run's id once CI's build on main has finished (D-353,
    # D-356, O-116). It reads the run from GitHub again, fetches that run's `staging-site` build
    # with the runner App's `actions: read` token (D-267), has the deploy adapter check the file set
    # and upload exactly those files to the project's assets-only Worker `<slug>-staging` with the
    # staging deploy token (the secret below), records the deploy on each item in Verifying on
    # staging whose merge commit it covers, and runs their staging check in the same run. A fail
    # move starts the builder's fix round (O-41), and a move to Done starts the first run of each
    # item that Done frees (D-329). The GitHub receiver calls it: after it records a `workflow_run`
    # `completed` with conclusion `success` for .github/workflows/ci.yml started by a push to the
    # default branch from the repository itself, only when neither switch holds the runner, so a
    # replay, a pull request's run, a failed run and another workflow start nothing. It uses the
    # receiver's Windmill token (the `platform` environment secret `RECEIVER_WINDMILL_TOKEN`, in
    # the cluster Secret `github-receiver-windmill-token`, runbook step 15) through the shared
    # Windmill egress proxy (D-328), with `{"input": {"repo": ..., "runId": ...}}`. About one run
    # per push to main of each repository the runner App is installed on (D-164). The flow refuses
    # a repository that is not a registered project. The reconcile flow's staging deploy backstop
    # catches a missed event. A `deployment_status` starts nothing (D-356).
    trigger: called
    job_token_scopes: ["variables:read:f/foreman/*"]

  - name: advance_item
    path: f/foreman/advance_item
    entry: flows/advance-item.ts
    # Called with an item's id once CI has finished on its PR head and an advance from evidence
    # is due (architecture section 2.5 step 4, D-329 slice 4, O-104). It takes the reconcile
    # pass's own step 4 for that one item: the move into In QA review through the library with the
    # pass's trigger and guards, then QA's run on the head through the dispatch's start path. It
    # reads everything again and never trusts the event; under either switch it does nothing. The
    # GitHub receiver calls it: after it records CI's end on a PR head (a new final `ci_run`), and
    # only when the shared advance check (src/core/advances.ts) says the move's guards pass now, so
    # a replay, a pending result, an item not due and the switches start nothing. It uses the
    # receiver's Windmill token (the `platform` environment secret `RECEIVER_WINDMILL_TOKEN`, in
    # the cluster Secret `github-receiver-windmill-token`, runbook step 15) through the shared
    # Windmill egress proxy (D-328), with `{"input": {"nodeId": ...}}`. About one run per
    # head whose CI ends green with the item's move due (D-164). The reconcile flow's advance step
    # is the backstop.
    trigger: called
    job_token_scopes: ["variables:read:f/foreman/*"]

  - name: cancel_runs
    path: f/foreman/cancel_runs
    entry: flows/cancel-runs.ts
    # D-202: called right after the kill switch is turned on, and run by the reconcile flow on
    # every pass the kill switch stops. It stops every active agent run and ends it cancelled.
    trigger: called
    job_token_scopes: ["variables:read:f/foreman/*"]

  - name: plan_approval
    path: f/foreman/plan_approval
    entry: flows/plan-approval.ts
    # Called with an idea id by the state API, right after it records the planning chat's
    # submission (D-273 (2), D-274, D-283), with its own Windmill token that can start only this
    # flow (the `platform` environment secret `STATE_API_WINDMILL_TOKEN`, in the cluster Secret
    # `state-api-windmill-plan-approval-token`, runbook step 15), through the shared Windmill
    # egress proxy (D-284, D-328). The call is src/adapters/windmill/plan-approval-flow.ts: an
    # async run of this script by path, with `{"input": {"ideaId": ...}}` (O-101). One run per
    # submission, and none under the kill switch or dry run (D-333), as the receiver's starts. It
    # opens Didi's plan-approval request at once; the reconcile flow's plan approval pass stays as
    # the safety net for a start that failed or that a switch held.
    trigger: called
    job_token_scopes: ["variables:read:f/foreman/*"]

  - name: option_capture
    path: f/foreman/option_capture
    entry: flows/option-capture.ts
    # Called with a design item's id once CI has finished on its PR head (O-88, D-274). It
    # captures the Designer's exploration options from CI's `options` bundle, opens Didi's
    # visual-approval request and asks again for the Designer report's move into Waiting for
    # Didi. A refusal the Designer caused counts once per head and starts the fix round; the
    # request links CI's run on any repository (O-89, D-348). The GitHub receiver calls it
    # (D-291, D-327, O-101): after it records CI's end on a PR head, and only when capture's own
    # due check says a capture is due, so a replay, a pending result, an item not due and the
    # switches start nothing. It uses the receiver's Windmill token (the `platform` environment
    # secret `RECEIVER_WINDMILL_TOKEN`, in the cluster Secret `github-receiver-windmill-token`,
    # runbook step 15) through the shared Windmill egress proxy (D-328), with
    # `{"input": {"nodeId": ...}}`. The run-end flow tries the same capture at a
    # Designer run's end, and the reconcile flow's capture pass is the backstop.
    trigger: called
    job_token_scopes: ["variables:read:f/foreman/*"]

  - name: hold_release_request
    path: f/foreman/hold_release_request
    entry: flows/hold-release-request.ts
    # Called with a held item's id only when Didi asks for a fresh release request for it from
    # the held-items list in the daily check (D-272, O-90): each entry names this path and the
    # input. No schedule, pass or other flow starts it, so nothing re-asks Didi on a timer. It
    # opens the same request the Triage handoff opens, and refuses an item that is not held, one
    # with an open request and one whose release is due; the kill switch and dry run write
    # nothing. Didi starts it from its page in the Windmill workspace, signed in (D-295); the
    # daily check's page links each held item to that page (D-320, O-100). No new credential.
    trigger: called
    job_token_scopes: ["variables:read:f/foreman/*"]

  - name: cancel_item
    path: f/foreman/cancel_item
    entry: flows/cancel-item.ts
    # Didi's own cancel of a work item (D-308, O-97), with the item's id and Didi's reason; with
    # askCouncil, the Council is asked whether the item is still needed instead. Didi starts it
    # from its page in the Windmill workspace, signed in, as hold_release_request (O-90, D-295).
    # Never a public or signed-token link. No schedule, pass or other flow starts it; the kill
    # switch and dry run write nothing. No new credential.
    trigger: called
    job_token_scopes: ["variables:read:f/foreman/*"]

  - name: register_project
    path: f/foreman/register_project
    entry: flows/register-project.ts
    # Didi's register-project form (D-345, D-346, D-348, O-109), with the project's slug and a
    # one-line description, which becomes the repository's description that Launchpad's Bootstrap
    # reads. Didi starts it from its page in the Windmill workspace, signed in, as cancel_item
    # (O-97, D-295). Never a public or signed-token link. No schedule, pass or other flow starts
    # it. It refuses a slug not listed in infra/kubernetes/settings/production.json on main,
    # creates didi-build/<slug> from didi-build/launchpad, always public (D-348), and records the
    # project; a project already recorded is already_registered. The kill switch refuses; dry run
    # creates and writes nothing. No new Windmill credential: the GitHub tokens are the runner
    # App's, minted per step, and only this form's carries Repository creation (D-346). Then
    # (D-358, O-114) it adds the repository to BOOTSTRAP_TOKEN's selected repositories and starts
    # Bootstrap again on main, each with a token narrowed to the new repository. Run again on a
    # project whose setup has not finished, it grants and restarts again.
    trigger: called
    job_token_scopes: ["variables:read:f/foreman/*"]

  - name: remove_bootstrap_access
    path: f/foreman/remove_bootstrap_access
    entry: flows/remove-bootstrap-access.ts
    # Called with `{"input": {"repo": ...}}` once Bootstrap's restarted run on a repository of
    # didi-build ends, whatever its conclusion (D-358, O-114). It removes the repository from
    # BOOTSTRAP_TOKEN's selected repositories with a token minted for that one call. The GitHub
    # receiver calls it after it records a `workflow_run` `completed` for
    # .github/workflows/bootstrap.yml started by `workflow_dispatch`, only when neither switch
    # holds the runner, so a replay and a run started by a push start nothing. It uses the
    # receiver's Windmill token (the `platform` environment secret `RECEIVER_WINDMILL_TOKEN`, in
    # the cluster Secret `github-receiver-windmill-token`, runbook step 15) through the shared
    # Windmill egress proxy (D-328). About one run per registered project (D-164). Under the kill
    # switch it does nothing (N-100); in dry run it reports. The reconcile pass's backstop removes
    # any access it missed.
    trigger: called
    job_token_scopes: ["variables:read:f/foreman/*"]

  - name: request_transition
    path: f/foreman/request_transition
    entry: flows/request-transition.ts
    # For an event, a bot report, a human or a timeout, with the trigger's own id. Which caller
    # turns a bot report or a GitHub event into this call is open (M3.1 report).
    trigger: called
    job_token_scopes: ["variables:read:f/foreman/*"]

  - name: approval
    path: f/foreman/approval
    # A Windmill flow of two steps, like the M0.4 spike: `ask` suspends with the form below and
    # sends the approval page to Didi only (D-170), `record` is this entry. `ask` needs the
    # notification adapter and the gate lifecycle (M4.1), so only `record` is built. The same form
    # answers the planning chat's plan-approval request (D-266) and a held item's release request
    # (D-269): neither lists options, so the Options field shows none. A visual approval's
    # question ends with the link to the CI run holding the screenshots (O-89), which `ask`
    # shows as the request's question text. Once an answer is recorded, an escalation Didi's
    # answer returned to its building state starts the item's fix round in the same run, as the
    # Council's answer does at its run's end (O-104), unless a switch holds the runner.
    entry: flows/approval-resume.ts
    trigger: approval_resume
    # The scopes of the `record` step's script; the `ask` step is not built (M4.1).
    job_token_scopes: ["variables:read:f/foreman/*"]
    suspend:
      required_events: 1
      # D-170: every approval expires after a short time. One day, as in M0.4, until M4.1 sets it.
      timeout_seconds: 86400
      continue_on_disapprove_timeout: true
      # D-200, D-254: the three answers are the form's `decision` field, so the page's own cancel
      # button is hidden and a resume can only be an answer or a timeout. Checked against
      # Windmill's OpenFlow spec at deploy (first-hosting runbook, step 15).
      hide_cancel: true
      # D-254: one form with three fields. The rules (Approve names exactly one option on a
      # request that lists options; Request changes and Reject need feedback) are checked by the
      # runner after the form is sent (src/core/approvals.ts); an answer that breaks one records
      # nothing and a fresh request opens with a one-line note saying why.
      resume_form:
        decision:
          type: string
          required: true
          enum: [Approve, Request changes, Reject]
        # A multi-select of the request's own options. The list is empty here and filled per
        # request: `ask` returns Windmill's dynamic enums for the form, `{enums: {options:
        # [...]}}`, from `approvalFormEnums(gate)` (the request's `payload.options`). Checked at
        # deploy (first-hosting runbook, step 15): that Windmill fills the choices from `enums`,
        # that an array of strings with enum items renders as a multi-select, and how it looks
        # on Didi's phone. A request that lists no options shows an empty field.
        options:
          type: array
          required: false
          items: { type: string, enum: [] }
        feedback: { type: string, required: false }
        # D-278: on a visual approval, Didi's own judgement of the change's size, optional. Left
        # blank, the Council's call on that request counts as unmeasured. A choice, not a
        # checkbox, so that skipping it is not read as "No".
        small_tweak:
          type: string
          required: false
          enum: ["Yes, a small tweak", "No, not a small tweak"]

# GitHub webhooks go to the receiver service (ADR 0113), not to Windmill, so no flow ingests
# them and none is listed here.

resources:
  # Every secret here is a Windmill secret variable, which Windmill encrypts with the workspace's
  # key, and every value a plain variable; none is a Windmill resource, which Windmill stores as
  # given (D-370). Each lives at `f/foreman/` (the flows' folder) followed by its path or name,
  # and holds the value itself, as the flows read it. `windmill_path` spells that out for each one
  # stored outside the deploy: by the Platform workflow's job, or by Didi by hand.
  #
  # A run's model key is read at the path its bot file's provider names for the run's project,
  # projects/<slug>/models/<provider> (D-143, contracts/bots/), a secret variable at
  # `f/foreman/projects/<slug>/models/<provider>`. Each is stored at first hosting (runbook step
  # 12).
  #
  # The runner's cluster token, endpoint and CA certificate are not stored by hand: the Platform
  # workflow's `runner-token` job, which Didi approves, writes them (D-352, O-110, O-120): the
  # token as it is, a secret variable; the endpoint as `https://host[:port]` and the certificate in
  # PEM, plain variables. The Windmill binding (flows/lib/windmill.ts) reads these three there.
  #
  # The services' own secrets (the planning chat's token hash and the three Windmill tokens that
  # start flows) are not kept in Windmill: each lives only in the `platform` environment's secrets
  # and the cluster's Secrets (D-351, first-hosting runbook step 15).
  #
  # The runner's database login (step 15), and the staging deploy token and the Cloudflare account
  # id (D-353, O-116, step 16), are stored by Didi by hand at first hosting, as secret variables at
  # their `windmill_path`. Until the staging pair is stored the composition's credential port
  # refuses with `NotBuiltError`, so nothing is uploaded.
  secrets:
    - path: platform/state-store/runner-database-url
      holds: A login user in the factory_runner role (ADR 0104). New credential at first hosting
      windmill_path: f/foreman/platform/state-store/runner-database-url
      written_by: Didi, by hand (first-hosting runbook step 15)
    - path: platform/agent-cluster/runner-token
      holds: The runner's cluster token (ADR 0106 section 1, first-hosting runbook step 8)
      windmill_path: f/foreman/platform/agent-cluster/runner-token
      written_by: the Platform workflow's runner-token job (D-352)
    - path: platform/cloudflare/staging-deploy-token
      holds: The staging deploy token, one Cloudflare API token with Workers Scripts Edit on the account only (D-353, O-116). New credential at first hosting
      windmill_path: f/foreman/platform/cloudflare/staging-deploy-token
      written_by: Didi, by hand (first-hosting runbook step 16)
    - path: platform/cloudflare/account-id
      holds: The Cloudflare account id of the staging Workers, 32 hex characters, kept as a secret as D-361 keeps it (O-116)
      windmill_path: f/foreman/platform/cloudflare/account-id
      written_by: Didi, by hand (first-hosting runbook step 16)
  values:
    - name: spec_version
      holds: The git commit of docs/spec.md and contracts/ the bundle was built from
    - name: github_developer_app_login
      holds: The Developer App's login (D-156)
    - name: github_designer_app_login
      holds: The Designer App's login (D-156)
    - name: github_runner_app_slug
      holds: The runner App's slug (D-156)
    - name: agent_cluster_endpoint
      holds: The cluster's API address (first-hosting runbook step 8)
      windmill_path: f/foreman/agent_cluster_endpoint
      written_by: the Platform workflow's runner-token job (D-352)
    - name: agent_cluster_ca_certificate
      holds: The cluster's CA certificate (first-hosting runbook step 8)
      windmill_path: f/foreman/agent_cluster_ca_certificate
      written_by: the Platform workflow's runner-token job (D-352)
    - name: agent_run_settings
      holds: The Kubernetes run settings as JSON, with no secret in them (ADR 0106), the repo map Job's image, resources and deadline included (D-275 (2))
    - name: agent_images
      holds: The agent image references by image kind as JSON, each pinned by digest. Each bot file (contracts/bots/) names its kind
  # The four GitHub Apps' private keys, each a secret variable, and their ids, plain variables
  # beside them (D-368, D-370). Didi stores them by hand at first hosting (runbook step 15), with
  # a copy of each key in Bitwarden. No flow reads them yet: every GitHub token port refuses
  # (`NotBuiltError`) until the Apps' token code is written, so they are not among the secrets and
  # values the composition reads above.
  github_apps:
    secrets:
      - path: platform/github/runner-app-private-key
        holds: The runner App's private key, in PEM (D-368)
        windmill_path: f/foreman/platform/github/runner-app-private-key

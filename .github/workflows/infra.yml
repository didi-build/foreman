name: Infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

concurrency:
  group: infra-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: tofu-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - name: Format check
        run: tofu fmt -check -recursive -diff infra
      - name: Validate each stack without a backend or credentials
        env:
          # Validation reads the encryption block but writes no state, so this placeholder protects nothing.
          TF_VAR_state_encryption_passphrase: validate-only-placeholder-not-a-secret
        run: |
          set -euo pipefail
          for stack in infra/stacks/*/; do
            echo "::group::$stack"
            tofu -chdir="$stack" init -backend=false -input=false
            tofu -chdir="$stack" validate
            echo "::endgroup::"
          done

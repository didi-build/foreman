name: Platform

# The cluster's standing Kubernetes objects and its Secrets, from main (D-339, D-340, O-105). This
# replaces first-hosting steps 7, 8, 9 and 10 and the cluster Secrets of step 15, and adds a
# project: its file in the settings repository, then this plan and Didi's approval.
#
# - `render` (no environment, no secret): resolves the settings repository didi-build/foreman-
#   projects' main to one commit (.github/scripts/projects-commit.sh; a run started by hand may
#   name `projects_commit`, which must be that commit or an ancestor), checks it out at that
#   commit, and renders infra/kubernetes/settings/production.json with its project files into one
#   list of objects, kept as an artifact for one day, naming the commit in the summary (D-377,
#   ADR 0118 appendix A). Only this job runs the repository's TypeScript; the jobs that hold a
#   credential check out `.github/` only and apply what this job rendered. The run watcher's
#   policy gets a placeholder for the API server's address (192.0.2.1, TEST-NET-1, RFC 5737),
#   so the artifact never holds the real one (D-349). It also lists the candidates for the
#   add-only check: the project files with the standard size and the Cloudflare target
#   (.github/scripts/add-only.mjs, kept in the same artifact).
# - `plan` (environment `platform-plan`, main only, no reviewer): puts the API server's real
#   address into its own copy of the objects (api-server-address.sh), then `kubectl diff
#   --server-side`, published as the kind, namespace and name of each object to create or
#   change, never content. When there are changes, it runs the add-only check and sets
#   `add_only`: true only when the check passed, false on a refusal, an error or any doubt.
# - `apply` (environment `platform`, main only, Didi the required reviewer): only when the plan
#   has changes that are not add-only, puts the address in its own copy the same way and applies
#   the rendered objects the plan read, then runs the runbook's checks: the RBAC `kubectl auth
#   can-i` list, default deny, and pods on their pools.
# - `add-only-apply` (environment `platform-add-project`, main only, no reviewer, D-378, D-444):
#   only when the plan has changes and its add-only check passed
#   (.github/scripts/platform-add-only.sh, ADR 0118 appendix B): the cluster matches main and the
#   existing projects exactly, and the plan only adds the standard objects of one to three new
#   standard-size projects and the run watcher's namespace list. It runs the same check again with
#   its own credential, applies the same rendered objects and runs the same checks as `apply`. Its
#   name carries the projects, which the daily check reads from GitHub to list each apply made
#   without approval. Any doubt in the check sends the run to `apply` instead, never to this job.
# - `cluster-secrets` (environment `platform`, Didi's approval): only when started by hand with
#   `cluster_secrets`, creates or updates each Secret the runbook names from the environment's
#   secrets, through stdin only, then restarts the deployments whose Secret changed.
# - `runner-token` (environment `platform`, Didi's approval): only when started by hand with
#   `runner_token`, makes the `foreman-runner` service account's token (a Secret the cluster fills
#   in) and writes it, with the cluster's endpoint and CA certificate from this job's own
#   credential, into Windmill's variables (the token a secret variable) with a Windmill token
#   limited to writing exactly those three variables (D-352, D-370, O-110, O-120). Nothing it
#   writes is printed.
#
# Each job that reaches the cluster fetches its own short-lived admin credential with the
# DigitalOcean token (D-340), valid for the job's own time limit, and removes it at its end.
# The repository is public, so the API server's address never shows in a log, a summary or an
# artifact (D-349, O-107): only the jobs that hold the credential read it, from the cluster,
# and mask it before anything prints; no job passes it to another.
# Pull requests never run this workflow. One run at a time.

on:
  push:
    branches: [main]
    paths:
      - "infra/kubernetes/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/platform.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      projects_commit:
        description: "A commit of didi-build/foreman-projects this run must contain (optional; the run uses its main)"
        type: string
        default: ""
      cluster_secrets:
        description: "Also create or update the cluster's Secrets from the platform environment's secrets (Didi approves)"
        type: boolean
        default: false
      runner_token:
        description: "Also write the runner's cluster token into Windmill (Didi approves)"
        type: boolean
        default: false

concurrency:
  group: platform
  cancel-in-progress: false

permissions: {}

env:
  # The factory stack's cluster_name (infra/stacks/factory/variables.tf).
  CLUSTER_NAME: foreman
  SETTINGS_FILE: infra/kubernetes/settings/production.json
  # The project list (D-377, D-442): public, read with no token, checked out into this fixed,
  # git-ignored folder.
  PROJECTS_REPOSITORY: didi-build/foreman-projects
  PROJECTS_DIR: foreman-projects
  FIELD_MANAGER: foreman-platform-workflow

jobs:
  render:
    name: render
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      projects_commit: ${{ steps.projects.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Resolve the project list's commit
        id: projects
        env:
          PROJECTS_COMMIT: ${{ inputs.projects_commit }}
        run: |
          set -euo pipefail
          .github/scripts/projects-commit.sh "https://github.com/${PROJECTS_REPOSITORY}.git"
      - name: Check out the project list at that commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.PROJECTS_REPOSITORY }}
          ref: ${{ steps.projects.outputs.commit }}
          path: ${{ env.PROJECTS_DIR }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm ci
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
      - name: Render the settings and the project list into the cluster's objects
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/render"
          # A placeholder that is never routed (TEST-NET-1, RFC 5737): the jobs with the cluster
          # credential put the API server's real address in their own copy (api-server-address.sh).
          jq '.platform.kubernetesApi = {"addresses":["192.0.2.1"],"port":443}' "$SETTINGS_FILE" >"$RUNNER_TEMP/render/settings.json"
          if ! node infra/kubernetes/render.ts "$RUNNER_TEMP/render/settings.json" "$PROJECTS_DIR" >"$RUNNER_TEMP/render/manifests.json" 2>"$RUNNER_TEMP/render/error.txt"; then
            {
              echo "## The settings do not render"
              echo
              echo "Fix \`$SETTINGS_FILE\` in a pull request, or the project file in \`$PROJECTS_REPOSITORY\`. The first setting or file at fault:"
              echo
              echo '```text'
              cat "$RUNNER_TEMP/render/error.txt"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if jq -e '[.items[] | select(.kind == "Secret")] | length > 0' "$RUNNER_TEMP/render/manifests.json" >/dev/null; then
            echo "::error::The render holds a Secret. Secrets are created only by the cluster Secrets job."
            exit 1
          fi
          jq -r '.items | group_by(.kind)[] | "\(.[0].kind): \(length)"' "$RUNNER_TEMP/render/manifests.json"
      - name: List the standard-size projects for the add-only check (D-378)
        run: |
          set -euo pipefail
          # The candidates (ADR 0118 appendix B). If they cannot be listed, the file is left out,
          # and the plan's add-only check then refuses, so the apply waits for Didi (fail closed).
          if ! node .github/scripts/add-only.mjs candidates "$SETTINGS_FILE" "$PROJECTS_DIR" >"$RUNNER_TEMP/render/candidates.json"; then
            rm -f "$RUNNER_TEMP/render/candidates.json"
            echo "::warning::The standard-size projects could not be listed, so this run's apply waits for Didi's approval."
          fi
      - name: Keep the rendered objects for the plan and the apply
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-manifests
          path: |
            ${{ runner.temp }}/render/manifests.json
            ${{ runner.temp }}/render/candidates.json
          if-no-files-found: error
          retention-days: 1

  plan:
    name: kubectl-diff
    needs: render
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: platform-plan
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      add_only: ${{ steps.add-only.outputs.add_only }}
      add_only_projects: ${{ steps.add-only.outputs.projects }}
    env:
      CREDENTIAL_SECONDS: "600"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Fetch the rendered objects
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: platform-manifests
          path: ${{ runner.temp }}/render
      # Node runs only .github/scripts/add-only.mjs here, which imports Node's built-ins only.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install kubectl and doctl at pinned versions
        run: |
          set -euo pipefail
          .github/scripts/install-cluster-tools.sh
      - name: Fetch a short-lived cluster credential
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          set -euo pipefail
          .github/scripts/cluster-credential.sh
      - name: Put the API server's address into this runner's copy of the objects
        run: |
          set -euo pipefail
          .github/scripts/api-server-address.sh "$RUNNER_TEMP/render/manifests.json"
      - name: Diff the rendered objects against the cluster
        id: diff
        run: |
          set -euo pipefail
          .github/scripts/platform-plan.sh "$RUNNER_TEMP/render/manifests.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check whether the plan only adds projects (D-378)
        id: add-only
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Fails closed (ADR 0118 appendix B): only the check's exit 0 makes the run add-only. A
          # refusal, an error or any doubt sends the apply to `kubectl-apply`, which waits for Didi.
          status=0
          .github/scripts/platform-add-only.sh "$RUNNER_TEMP/render/manifests.json" "$RUNNER_TEMP/render/candidates.json" >"$RUNNER_TEMP/add-only.md" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "add_only=true" >>"$GITHUB_OUTPUT"
            echo "So \`kubectl-apply-add-only\` applies it without approval, in the environment \`platform-add-project\`, after checking again with its own credential." >>"$RUNNER_TEMP/add-only.md"
          else
            echo "add_only=false" >>"$GITHUB_OUTPUT"
            if [ ! -s "$RUNNER_TEMP/add-only.md" ]; then
              printf '%s\n\n%s\n' "## Add-only check (D-378)" "**Not add-only:** the check stopped with an error. The reviewed apply waits for Didi's approval, as for any other change." >"$RUNNER_TEMP/add-only.md"
            fi
          fi
          tee -a "$GITHUB_STEP_SUMMARY" <"$RUNNER_TEMP/add-only.md"
      - name: Remove the credential
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/kubeconfig"

  apply:
    name: kubectl-apply
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.changed == 'true' && needs.plan.outputs.add_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: platform
    permissions:
      contents: read
    env:
      CREDENTIAL_SECONDS: "1200"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Fetch the rendered objects the plan read
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: platform-manifests
          path: ${{ runner.temp }}/render
      - name: Install kubectl and doctl at pinned versions
        run: |
          set -euo pipefail
          .github/scripts/install-cluster-tools.sh
      - name: Fetch a short-lived cluster credential
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          set -euo pipefail
          .github/scripts/cluster-credential.sh
      - name: Put the API server's address into this runner's copy of the objects
        run: |
          set -euo pipefail
          .github/scripts/api-server-address.sh "$RUNNER_TEMP/render/manifests.json"
      - name: Apply the rendered objects
        run: |
          set -euo pipefail
          kubectl apply --server-side --field-manager="$FIELD_MANAGER" --filename "$RUNNER_TEMP/render/manifests.json"
      - name: Run the runbook's checks
        run: |
          set -euo pipefail
          {
            echo "## Platform checks"
            .github/scripts/platform-checks.sh "$RUNNER_TEMP/render/manifests.json" all
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove the credential
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/kubeconfig"

  # The add-only apply (D-378, D-444): the reviewed `apply` job's steps, with the add-only check
  # run again just before the apply, and two summary lines. A test keeps the shared steps equal.
  add-only-apply:
    name: kubectl-apply-add-only (${{ needs.plan.outputs.add_only_projects }})
    needs: [render, plan]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.changed == 'true' && needs.plan.outputs.add_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: platform-add-project
    permissions:
      contents: read
    env:
      CREDENTIAL_SECONDS: "1200"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Fetch the rendered objects the plan read
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: platform-manifests
          path: ${{ runner.temp }}/render
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install kubectl and doctl at pinned versions
        run: |
          set -euo pipefail
          .github/scripts/install-cluster-tools.sh
      - name: Fetch a short-lived cluster credential
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          set -euo pipefail
          .github/scripts/cluster-credential.sh
      - name: Put the API server's address into this runner's copy of the objects
        run: |
          set -euo pipefail
          .github/scripts/api-server-address.sh "$RUNNER_TEMP/render/manifests.json"
      # Appendix B: a change on the cluster since the plan fails this job, and nothing is applied.
      - name: Check again, with this job's own credential, that the plan only adds the projects
        env:
          EXPECTED_PROJECTS: ${{ needs.plan.outputs.add_only_projects }}
        run: |
          set -euo pipefail
          .github/scripts/platform-add-only.sh "$RUNNER_TEMP/render/manifests.json" "$RUNNER_TEMP/render/candidates.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Apply the rendered objects
        run: |
          set -euo pipefail
          kubectl apply --server-side --field-manager="$FIELD_MANAGER" --filename "$RUNNER_TEMP/render/manifests.json"
      - name: Say in the summary that this applied without approval
        env:
          PROJECT_LIST_COMMIT: ${{ needs.render.outputs.projects_commit }}
          ADD_ONLY_PROJECTS: ${{ needs.plan.outputs.add_only_projects }}
        run: |
          set -euo pipefail
          {
            echo "## Add-only: applied without approval (D-378)"
            echo
            echo "The plan only added new standard-size projects, so this job applied it in the environment \`platform-add-project\`, which has no reviewer. Project list \`didi-build/foreman-projects\` at \`${PROJECT_LIST_COMMIT}\`; new projects \`${ADD_ONLY_PROJECTS}\`. The next daily check lists this apply."
            echo
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Run the runbook's checks
        run: |
          set -euo pipefail
          {
            echo "## Platform checks"
            .github/scripts/platform-checks.sh "$RUNNER_TEMP/render/manifests.json" all
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove the credential
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/kubeconfig"

  cluster-secrets:
    name: cluster-secrets
    needs: [plan, apply, add-only-apply]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.cluster_secrets && needs.plan.result == 'success' && (needs.apply.result == 'success' || needs.apply.result == 'skipped') && (needs.add-only-apply.result == 'success' || needs.add-only-apply.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: platform
    permissions:
      contents: read
    env:
      CREDENTIAL_SECONDS: "900"
      STACK: infra/stacks/factory
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      REDACT_NAMES: CLOUDFLARE_ACCOUNT_ID,STATE_BUCKET
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATE_BUCKET: ${{ secrets.STATE_BUCKET }}
    steps:
      # The whole repository: the tunnel token is read from the factory stack's state.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - name: Install kubectl and doctl at pinned versions
        run: |
          set -euo pipefail
          .github/scripts/install-cluster-tools.sh
      - name: Fetch a short-lived cluster credential
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          set -euo pipefail
          .github/scripts/cluster-credential.sh
      - name: tofu init against the R2 state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
          TF_VAR_state_encryption_passphrase: ${{ secrets.STATE_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          .github/scripts/tofu-init.sh
      - name: Create or update the Secrets, then restart what reads them
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
          TF_VAR_state_encryption_passphrase: ${{ secrets.STATE_ENCRYPTION_PASSPHRASE }}
          STATE_API_DATABASE_URL: ${{ secrets.STATE_API_DATABASE_URL }}
          RECEIVER_DATABASE_URL: ${{ secrets.RECEIVER_DATABASE_URL }}
          RECEIVER_WEBHOOK_SECRET: ${{ secrets.RECEIVER_WEBHOOK_SECRET }}
          PLANNING_TOKEN: ${{ secrets.PLANNING_TOKEN }}
          STATE_API_WINDMILL_TOKEN: ${{ secrets.STATE_API_WINDMILL_TOKEN }}
          RECEIVER_WINDMILL_TOKEN: ${{ secrets.RECEIVER_WINDMILL_TOKEN }}
          RUN_WATCHER_WINDMILL_TOKEN: ${{ secrets.RUN_WATCHER_WINDMILL_TOKEN }}
        run: |
          set -euo pipefail
          # The report holds names only; the script's own output, with its masks, stays in the log.
          export REPORT="$RUNNER_TEMP/cluster-secrets.md"
          status=0
          .github/scripts/cluster-secrets.sh || status=$?
          if [ -f "$REPORT" ]; then
            tee -a "$GITHUB_STEP_SUMMARY" <"$REPORT"
          fi
          exit "$status"
      - name: Remove the credential
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/kubeconfig"

  runner-token:
    name: runner-token
    needs: [plan, apply, add-only-apply]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.runner_token && needs.plan.result == 'success' && (needs.apply.result == 'success' || needs.apply.result == 'skipped') && (needs.add-only-apply.result == 'success' || needs.add-only-apply.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: platform
    permissions:
      contents: read
    env:
      CREDENTIAL_SECONDS: "600"
    steps:
      # The scripts and the settings file (the Windmill host and workspace), and nothing else.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/
            /infra/kubernetes/settings/production.json
          sparse-checkout-cone-mode: false
      - name: Install kubectl and doctl at pinned versions
        run: |
          set -euo pipefail
          .github/scripts/install-cluster-tools.sh
      - name: Fetch a short-lived cluster credential
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          set -euo pipefail
          .github/scripts/cluster-credential.sh
      - name: Make the runner's cluster token and write it into Windmill
        env:
          WINDMILL_RUNNER_RESOURCES_TOKEN: ${{ secrets.WINDMILL_RUNNER_RESOURCES_TOKEN }}
        run: |
          set -euo pipefail
          .github/scripts/runner-token.sh
      - name: Remove the credential
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/kubeconfig"

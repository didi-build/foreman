name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  template-smoke:
    name: template-smoke
    if: github.repository == 'didi-build/launchpad'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: init-project smoke test in a clean copy
        run: |
          set -euo pipefail
          repo_root="$PWD"
          smoke_init_copy() {
            local personal_data_flag="$1"
            local expect_nodrift="$2"
            local tmp
            tmp=$(mktemp -d)
            cp -a "$repo_root" "$tmp/lp"
            cd "$tmp/lp"
            rm -rf node_modules .git
            if [ "$expect_nodrift" = "yes" ]; then
              npm ci
            fi
            npm run init-project -- smoke-test "Smoke Test" "CI template smoke" "$personal_data_flag"
            node scripts/verify-smoke-init-copy.mjs --slug smoke-test --purpose "CI template smoke" --expect-nodrift "$expect_nodrift"
            npm ci
            npm run check
          }
          smoke_init_copy --no-personal-data no
          smoke_init_copy --personal-data yes

  verify-action-pins:
    name: verify-action-pins
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Detect workflow file changes
        id: workflows
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify "origin/${BASE_REF}" >/dev/null 2>&1; then
            printf '::error::%s\n' "origin/${BASE_REF} missing after checkout; verify-action-pins needs actions/checkout fetch-depth: 0. Refusing to skip the pin check."
            exit 1
          fi
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD" -- .github/workflows/)"
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify action pins
        if: steps.workflows.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run verify-action-pins

  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm ci
        id: install
        run: npm ci
        continue-on-error: true
      - name: npm run check
        id: check
        if: steps.install.outcome == 'success'
        run: npm run check
        continue-on-error: true
      - name: Publish test report (Checks tab)
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2.7.0
        if: always() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && steps.install.outcome == 'success'
        with:
          name: Vitest
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Build PR test summary
        id: summary
        if: always() && github.event_name == 'pull_request'
        run: node scripts/ci-test-summary.mjs >> "$GITHUB_OUTPUT"
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: PR test summary (Dependabot)
        if: always() && github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTPUT_MODE: body
        run: node scripts/ci-test-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Find PR test results comment
        id: find-comment
        if: always() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- launchpad-vitest-results -->"
      - name: Update PR test results comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        if: always() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: ${{ steps.summary.outputs.body }}
      - name: Fail job if install or check failed
        if: steps.install.outcome != 'success' || steps.check.outcome != 'success'
        run: exit 1

  # CI's preview check (D-354, O-111): hosted branch previews are dropped. On CI's own machine,
  # with no secret and only contents read, this job builds the head commit, writes the commit
  # marker into the build, serves it on 127.0.0.1 and checks that the app loads and serves that
  # commit. The runner records this job's result as `preview_check`, and only this job's
  # (`PREVIEW_CHECK_JOB` and `PREVIEW_CHECK_WORKFLOW` in src/core/preview-check.ts). On a pull
  # request the commit is the PR's head, never the merge ref GitHub would check out by default.
  # The scripts live in .github/scripts/, a privileged path.
  # On a push to main only, the build it probed is kept as the artifact `staging-site` for 7 days:
  # the runner fetches it with its `actions: read` and deploys exactly those files to the project's
  # staging site (D-353, O-116). The job still holds no secret and no environment.
  preview-check:
    name: preview-check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SITE_PORT: "4173"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Build the app
        run: npm run build
      - name: Write the commit marker
        run: node .github/scripts/preview-check.mjs marker dist/gallery "$COMMIT_SHA"
      - name: Serve the build on 127.0.0.1 and probe it
        run: |
          set -euo pipefail
          node .github/scripts/serve-site.mjs dist/gallery "$SITE_PORT" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node .github/scripts/preview-check.mjs probe "http://127.0.0.1:${SITE_PORT}" "$COMMIT_SHA"
      - name: Keep the probed build for the staging deploy
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-site
          path: dist/gallery/
          if-no-files-found: error
          retention-days: 7
